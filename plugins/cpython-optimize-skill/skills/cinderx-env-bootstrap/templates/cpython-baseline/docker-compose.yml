services:
  cpython-baseline:
    image: ${BASE_IMAGE:-cinderx-pyperf-realenv:arm64}
    build: .
    platform: linux/arm64
    hostname: cpython-baseline
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Stock CPython source tree for JIT-enabled baseline build
      - ${CPYTHON_ROOT:?CPYTHON_ROOT is required}:/cpython:ro
      # CinderX source tree
      - ${CINDERX_ROOT:?CINDERX_ROOT is required}:/cinderx
      # CinderX wheel files
      - ${CINDERX_DIST:-${CINDERX_ROOT}/dist}:/dist:ro
      # Pyperformance source tree
      - ${PYPERFORMANCE_ROOT:?PYPERFORMANCE_ROOT is required}:/pyperformance:ro
      # Worker startup hook for CinderX JIT
      - ${PYPERF_HOOK_ROOT:-${CINDERX_ROOT}/scripts/arm/pyperf_env_hook}:/pyperf_env_hook:ro
      # Benchmark scripts
      - ${SCRIPTS_DIR:-./scripts}:/scripts:ro
      # Results
      - ${RESULTS_DIR:-./results}:/results
      # Experiment configs
      - ${CONFIGS_DIR:-./configs}:/configs:ro
      # Shared CinderX wheel cache
      - cinderx-wheel-cache:/opt/cinderx-wheel-cache

    environment:
      - PYPERFORMANCE_ROOT=/pyperformance
      - PYPERFORMANCE_HOOK_ROOT=/pyperf_env_hook
      - BENCHMARK_CONFIG_ROOT=/configs
      - CINDERX_SOURCE_ROOT=/cinderx
      - http_proxy=${http_proxy:-http://host.docker.internal:7890}
      - https_proxy=${https_proxy:-http://host.docker.internal:7890}
      - HTTP_PROXY=${HTTP_PROXY:-http://host.docker.internal:7890}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://host.docker.internal:7890}

    # Keep container running
    stdin_open: true
    tty: true

volumes:
  cinderx-wheel-cache:
    name: cinderx-wheel-cache
    driver: local
